name: llm-proxy

services:
  llm-proxy:
    container_name: llm-proxy
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - usage-data:/app/logs
      - ~/.config/llm-proxy/providers.json:/app/providers.json:ro

volumes:
  usage-data:
